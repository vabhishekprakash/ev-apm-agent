services:
  # replay -> detector is a JSON-lines stream. Compose services cannot pipe
  # stdout to each other, so replay appends to a file on the shared event-bus
  # volume and the detector tails it. Same contract as the local
  # `python replay/main.py | python detector/main.py` pipeline.
  # Append-only ('>>'): a '>' truncation on replay restart would make the
  # detector's tail -F re-read from byte 0 and reprocess all history as
  # duplicate alerts. Reset the bus between demos with `docker compose down -v`.
  replay:
    build:
      context: ./replay
      dockerfile: Dockerfile
    container_name: evapm-replay
    command: sh -c "python main.py >> /bus/events.jsonl"
    environment:
      DATA_DIR: ${DATA_DIR:-/app/data/raw}
      REPLAY_SPEED_MULTIPLIER: ${REPLAY_SPEED_MULTIPLIER:-1}
    volumes:
      - ./data:/app/data:ro
      - ./tests/fixtures:/app/tests/fixtures:ro
      - event-bus:/bus
    networks:
      - evapm-net

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: evapm-detector
    command: sh -c "tail -n +1 -F /bus/events.jsonl | python main.py"
    environment:
      ALERT_SINK: http
      ALERT_URL: http://ui:8000/alerts
      REFERENCE_DIR: /app/data/reference
      SILENCE_THRESHOLD_SECONDS: ${SILENCE_THRESHOLD_SECONDS:-90}
      # Calibrated on held-out normals (notebook 03) — the SPEC default -0.1
      # flags ~6% of normal sessions, over the 5% acceptance bar.
      LAYER2_THRESHOLD: ${LAYER2_THRESHOLD:--0.1193}
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - event-bus:/bus
    depends_on:
      # Gate on UI readiness, not just container start: at high replay speeds
      # the detector can emit alerts before uvicorn binds the port.
      ui:
        condition: service_healthy
      replay:
        condition: service_started
    networks:
      - evapm-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: evapm-ui
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    networks:
      - evapm-net

networks:
  evapm-net:
    driver: bridge

volumes:
  event-bus:

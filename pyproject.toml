[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-apm-agent"
version = "0.1.0"
description = "Watchful operator for EV charging stations — fault detection and drift monitoring"
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Abhishek", email = "vabhishekprakash@gmail.com"},
    {name = "Akhil", email = "prasadakhil0909@gmail.com"}
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.24",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
]
layer2 = [
    "torch>=2.0",
    "pyod>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["detector*", "replay*", "ui*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
